<!DOCTYPE html>
<html lang="fr">
<head>

<title>Résumé · Rédaction Administrative · ENEAM</title>

<style>
:root{
  --void:#050810;--panel:#0d1520;--panel2:#111e2e;
  --b1:#162030;--b2:#1e2d40;--b3:#243446;
  --teal:#00e5cc;--teal2:#00b8a3;--purple:#a78bfa;
  --green:#00ff9d;--amber:#ffb300;--red:#ff4757;--cyan:#00d4ff;
  --txt:#c8d6e0;--txt2:#7a9ab0;--txt3:#3d5568;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--txt);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,204,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,204,.015) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(0,229,204,.04) 1px,transparent 1px);background-size:40px 40px;background-position:20px 20px;pointer-events:none;z-index:0}

@keyframes scan{0%{transform:translateY(-100vh)}100%{transform:translateY(100vh)}}
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(0,229,204,.18),transparent);animation:scan 9s linear infinite;pointer-events:none;z-index:999}

.root{max-width:900px;margin:0 auto;padding:0 1.4rem 6rem;position:relative;z-index:1}

.nav{display:flex;align-items:center;justify-content:space-between;padding:.9rem 0;border-bottom:1px solid var(--b1);margin-bottom:2.5rem;position:sticky;top:0;background:rgba(5,8,16,.92);backdrop-filter:blur(12px);z-index:40;gap:1rem;flex-wrap:wrap}
.nav-back{display:flex;align-items:center;gap:.5rem;font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--txt2);text-decoration:none;padding:.3rem .7rem;border:1px solid var(--b2);border-radius:2px;transition:all .2s}
.nav-back:hover{border-color:var(--teal);color:var(--teal)}
.nav-title{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--txt3)}
.nav-title span{color:var(--teal)}
.nav-tag{font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:.2rem .6rem;border:1px solid rgba(0,229,204,.25);border-radius:2px;color:var(--teal);background:rgba(0,229,204,.07)}

.hdr{padding:1.5rem 0 2.5rem;text-align:center}
.hdr-eyebrow{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--txt3);letter-spacing:.18em;margin-bottom:1rem;display:flex;align-items:center;justify-content:center;gap:.6rem}
.hdr-eyebrow::before,.hdr-eyebrow::after{content:'';width:30px;height:1px;background:var(--b3)}
.hdr h1{font-size:clamp(1.8rem,5vw,3rem);font-weight:900;line-height:1.1;letter-spacing:-.02em;margin-bottom:.6rem}
.hdr h1 .t1{color:var(--txt)}
.hdr h1 .t2{color:var(--teal);text-shadow:0 0 30px rgba(0,229,204,.3)}
.hdr-sub{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--txt2)}
.hdr-sub .v{color:var(--green)}

.view-toggle{display:flex;gap:.5rem;justify-content:center;margin:2rem 0 2.5rem}
.vt-btn{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:500;padding:.4rem 1rem;border-radius:2px;border:1px solid var(--b2);background:transparent;color:var(--txt3);cursor:pointer;letter-spacing:.06em;transition:all .2s;text-transform:uppercase}
.vt-btn.active{border-color:var(--teal);color:var(--teal);background:rgba(0,229,204,.07);text-shadow:0 0 8px rgba(0,229,204,.3)}
.vt-btn:hover:not(.active){border-color:var(--b3);color:var(--txt2)}

#view-condensed{display:block}
#view-detail{display:none}

/* Vue condensée */
.condensed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:1rem}
.ccard{background:var(--panel);border:1px solid var(--b1);border-radius:4px;padding:1.2rem 1.3rem;cursor:pointer;transition:all .22s;position:relative;overflow:hidden}
.ccard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--cc);opacity:.7;transform:scaleX(0);transform-origin:left;transition:transform .3s}
.ccard:hover{border-color:var(--cc);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.ccard:hover::before{transform:scaleX(1)}
.ccard-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.ccard-ico{font-size:1.3rem}
.ccard-id{font-family:'JetBrains Mono',monospace;font-size:.58rem}
.ccard-title{font-size:.92rem;font-weight:700;margin-bottom:.35rem;line-height:1.25}
.ccard-nature{font-family:'JetBrains Mono',monospace;font-size:.62rem;margin-bottom:.5rem}
.ccard-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.7rem}
.ctag{font-family:'JetBrains Mono',monospace;font-size:.57rem;padding:.12rem .45rem;background:rgba(0,0,0,.3);border:1px solid var(--b2);border-radius:2px;color:var(--txt3)}
.ccard-hint{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--txt3)}
.ccard:hover .ccard-hint{color:var(--cc)}

/* Vue détaillée */
.themes-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:2rem}
.tl-item{display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;background:var(--panel);border:1px solid var(--b1);border-radius:3px;cursor:pointer;transition:all .2s}
.tl-item:hover,.tl-item.active{border-color:var(--item-col);background:var(--panel2)}
.tl-item.active .tl-name{color:var(--item-col)}
.tl-num{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--txt3);min-width:42px}
.tl-ico{font-size:1rem}
.tl-name{font-size:.85rem;font-weight:500;color:var(--txt);flex:1}
.tl-count{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--txt3)}
.tl-arrow{font-size:.7rem;color:var(--txt3);transition:all .2s}
.tl-item:hover .tl-arrow,.tl-item.active .tl-arrow{color:var(--item-col);transform:translateX(2px)}

.fiche{display:none;background:var(--panel);border:1px solid var(--b1);border-radius:6px;overflow:hidden;animation:ficheIn .3s ease}
.fiche.show{display:block}
@keyframes ficheIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fiche-header{padding:1.6rem 2rem;border-bottom:1px solid var(--b1);background:var(--panel2);position:relative;overflow:hidden}
.fiche-header::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--fiche-col)}
.fiche-eyebrow{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--txt3);letter-spacing:.12em;margin-bottom:.5rem}
.fiche-title{font-size:1.3rem;font-weight:700;color:var(--txt);margin-bottom:.3rem}
.fiche-subtitle{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--fiche-col);opacity:.8}
.fiche-body{padding:1.8rem 2rem}

.fsec{margin-bottom:2rem}
.fsec-title{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--fiche-col);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
.fsec-title::before{content:'//';color:var(--txt3)}
.fsec-title::after{content:'';flex:1;height:1px;background:var(--b2)}

.def-block{background:rgba(0,0,0,.25);border:1px solid var(--b2);border-left:2px solid var(--fiche-col);border-radius:0 4px 4px 0;padding:.9rem 1.1rem;margin-bottom:.8rem;font-size:.85rem;color:var(--txt2);line-height:1.75;font-weight:300}
.def-block .kw{font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:500}
.def-block strong{color:var(--txt);font-weight:500}

/* MODÈLE — bloc spécial pour reproduire la structure d'un document */
.modele{background:rgba(0,0,0,.4);border:1px solid var(--b2);border-radius:4px;padding:0;margin-bottom:1rem;overflow:hidden;font-family:'JetBrains Mono',monospace;font-size:.72rem}
.modele-title{font-size:.62rem;color:var(--fiche-col);letter-spacing:.12em;padding:.5rem .9rem;background:rgba(0,0,0,.3);border-bottom:1px solid var(--b2)}
.modele-body{padding:1rem 1.2rem;color:var(--txt2);line-height:2;white-space:pre-wrap}
.modele-body .ml{color:var(--fiche-col);font-weight:500}
.modele-body .mc{color:var(--amber);opacity:.8}
.modele-body .mn{color:var(--txt3)}

.example-block{background:rgba(0,229,204,.03);border:1px solid rgba(0,229,204,.12);border-radius:4px;padding:.9rem 1.1rem;margin-bottom:.8rem}
.example-block .ex-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--teal);letter-spacing:.1em;margin-bottom:.4rem}
.example-block .ex-content{font-size:.83rem;color:var(--txt2);line-height:1.7;font-weight:300}
.example-block code{font-family:'JetBrains Mono',monospace;color:var(--green);font-size:.78rem;background:rgba(0,255,157,.06);padding:.1rem .3rem;border-radius:2px}

.ftable{width:100%;border-collapse:collapse;margin-bottom:.8rem;font-size:.78rem}
.ftable th{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;padding:.5rem .8rem;border-bottom:1px solid var(--b2);text-align:left;background:rgba(0,0,0,.2)}
.ftable td{padding:.5rem .8rem;border-bottom:1px solid var(--b1);color:var(--txt2);font-weight:300}
.ftable tr:hover td{background:rgba(0,0,0,.2);color:var(--txt)}
.ftable .key{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500}

.retenir{border-radius:4px;padding:.9rem 1.1rem;margin-top:.5rem}
.retenir .r-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.1em;margin-bottom:.5rem}
.retenir ul{list-style:none;padding:0}
.retenir li{font-size:.82rem;color:var(--txt2);padding:.22rem 0 .22rem 1rem;position:relative;font-weight:300;line-height:1.55}
.retenir li::before{content:'›';position:absolute;left:0;font-family:'JetBrains Mono',monospace;font-weight:700}

.fiche-nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;border-top:1px solid var(--b1);background:var(--panel2)}
.fiche-nav-btn{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--txt3);background:transparent;border:1px solid var(--b2);border-radius:2px;padding:.3rem .8rem;cursor:pointer;transition:all .2s}
.fiche-nav-btn:hover:not(:disabled){border-color:var(--txt3);color:var(--txt)}
.fiche-nav-btn:disabled{opacity:.3;cursor:default}

.footer{margin-top:3rem;padding:1.2rem 0;border-top:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;position:relative;z-index:1}
.footer-brand{display:flex;align-items:center;gap:.7rem}
.footer-av{width:32px;height:32px;background:var(--panel);border:1px solid var(--teal);border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.8rem;color:var(--teal)}
.footer-name{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;color:var(--txt)}
.footer-role{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--txt3)}
.footer-wa{display:inline-flex;align-items:center;gap:.5rem;font-family:'JetBrains Mono',monospace;font-size:.65rem;color:#25d366;text-decoration:none;padding:.32rem .65rem;border:1px solid rgba(37,211,102,.25);border-radius:2px;transition:all .18s}
.footer-wa:hover{background:rgba(37,211,102,.06);border-color:rgba(37,211,102,.5)}
@media(max-width:600px){.root{padding:0 1rem 5rem}.fiche-body{padding:1.2rem 1rem}.fiche-header{padding:1.2rem 1rem}.fiche-nav{padding:.8rem 1rem}}
</style>
</head>

<script>
const THEMES = [
{
  id:'T01', icon:'📋', color:'#00e5cc', name:'La Note de Service',
  nature:'Document interne de communication descendante',
  tags:['Interne','Hiérarchique','Concis','Obligatoire'],
  resume:'Instruction écrite d\'un supérieur à ses subordonnés pour transmettre une information ou une directive.',
  sections:[
    {type:'defs',title:'DÉFINITION & NATURE',items:[
      {term:'Définition',def:'La note de service est un document administratif interne par lequel un supérieur hiérarchique informe ses subordonnés d\'une décision, d\'une instruction ou d\'une modification de procédure.'},
      {term:'Nature',def:'Document interne, à sens unique (descendant). Elle n\'attend pas de réponse. Elle est opposable aux agents qui la reçoivent.'},
      {term:'Objet',def:'Transmettre une information, donner une instruction, rappeler une règle, modifier un mode de fonctionnement interne.'},
    ]},
    {type:'table',title:'CARACTÉRISTIQUES',
      headers:['Critère','Valeur'],
      rows:[
        ['Sens','Descendant (supérieur → subordonné)'],
        ['Diffusion','Interne à l\'administration / service'],
        ['Ton','Impératif, neutre, concis'],
        ['Signature','Auteur avec qualité et titre'],
        ['Numérotation','N°…/…/… (service/année/numéro)'],
        ['Ampliation','Liste des destinataires en bas'],
      ]},
    {type:'modele',title:'STRUCTURE TYPE',
      label:'NOTE DE SERVICE',
      content:`<span class="ml">EN-TÊTE</span>
<span class="mc">MINISTÈRE / DIRECTION / SERVICE</span>
<span class="mn">─────────────────────────────</span>

<span class="ml">N°</span> <span class="mc">___/___/___ </span>                    <span class="mc">Lieu, le ___________</span>

<span class="ml">NOTE DE SERVICE</span>

<span class="ml">Objet :</span> <span class="mc">[Objet précis en quelques mots]</span>

─────────────────────────────

<span class="mn">[Corps du texte : exposé de la décision, instruction ou information]</span>
<span class="mn">[Paragraphe 1 : contexte ou motif]</span>
<span class="mn">[Paragraphe 2 : instruction ou mesure]</span>
<span class="mn">[Paragraphe 3 : application / entrée en vigueur]</span>

                              <span class="mc">[Signature]</span>
                         <span class="mc">[Nom, Prénom, Qualité]</span>

<span class="ml">Ampliation :</span>
<span class="mn">- Destinataire 1</span>
<span class="mn">- Destinataire 2</span>
<span class="mn">- Archives</span>`},
    {type:'example',title:'EXEMPLE CONCRET',
      content:'<code>NOTE DE SERVICE N° 015/ENEAM/DAF/2025</code>\n\nCotonou, le 10 janvier 2025\n\nObjet : Horaires de travail pendant le mois de février 2025\n\nLe Directeur Administratif et Financier informe l\'ensemble du personnel que, suite à la directive ministérielle du 5 janvier 2025, les horaires de travail sont modifiés comme suit pour le mois de février :\n— Entrée : 7h30 au lieu de 8h00\n— Sortie : 14h00\n\nTout agent en retard devra se signaler à l\'huissier. Cette disposition prend effet le 1er février 2025.'},
    {type:'retenir',title:'À RETENIR',items:[
      'La note de service est INTERNE et DESCENDANTE','Elle est numérotée et datée','Pas de formule de politesse ni d\'introduction longue','L\'objet est clairement indiqué en tête','Elle engage la responsabilité de son auteur','Court, précis, impératif = les 3 qualités essentielles'
    ]}
  ]
},
{
  id:'T02', icon:'📝', color:'#a78bfa', name:'Le Compte Rendu & PV',
  nature:'Document de restitution d\'une réunion ou d\'un événement',
  tags:['Réunion','Délibération','Fidèle','Structuré'],
  resume:'Narration fidèle et objective des débats, décisions et faits observés lors d\'une séance ou d\'une activité.',
  sections:[
    {type:'defs',title:'DÉFINITIONS',items:[
      {term:'Compte rendu',def:'Document qui relate fidèlement et chronologiquement les faits, discussions et décisions intervenus lors d\'une réunion, d\'une visite ou d\'une inspection. Il est descriptif et objectif.'},

    {type:'table',title:'COMPTE RENDU vs PROCÈS-VERBAL',

<span class="mn">- …</span>

<span class="ml">ORDRE DU JOUR :</span>
<span class="mn">1. [Point 1]</span>
<span class="mn">2. [Point 2]</span>

<span class="ml">DÉROULEMENT :</span>
<span class="mn">[Résumé fidèle des discussions point par point]</span>

<span class="ml">DÉCISIONS PRISES :</span>
<span class="mn">1. [Décision 1 — responsable — délai]</span>
<span class="mn">2. [Décision 2 — responsable — délai]</span>

                    <span class="mc">[Signature du rédacteur]</span>
                    <span class="mc">Nom, qualité</span>`},

function buildCondensed(){
  const cg = document.getElementById('cg');
  cg.innerHTML = '';
  THEMES.forEach((th,i)=>{
    const card = document.createElement('div');
    card.className = 'ccard';
    card.style.setProperty('--cc', th.color);
    card.innerHTML=`
      <div class="ccard-head">
        <span class="ccard-ico">${th.icon}</span>
        <span class="ccard-id" style="color:${th.color}">${th.id}</span>
      </div>
      <div class="ccard-title" style="color:${th.color}">${th.name}</div>
      <div class="ccard-nature" style="color:${th.color};opacity:.6">${th.nature}</div>
      <div class="ccard-tags">${th.tags.map(t=>`<span class="ctag">${t}</span>`).join('')}</div>
      <div class="ccard-hint">// ${th.resume.substring(0,70)}…</div>`;
    card.addEventListener('click',()=>{switchView('detail',document.querySelectorAll('.vt-btn')[1]);showFiche(i);});
    cg.appendChild(card);
  });
}

function buildThemeList(){
  const tl = document.getElementById('tl');
  tl.innerHTML = '';
  THEMES.forEach((th,i)=>{
    const item = document.createElement('div');
    item.className = 'tl-item';
    item.style.setProperty('--item-col', th.color);
    item.innerHTML=`
      <span class="tl-num">${th.id}</span>
      <span class="tl-ico">${th.icon}</span>
      <span class="tl-name">${th.name}</span>
      <span class="tl-count" style="color:${th.color}">${th.sections.length} sections</span>
      <span class="tl-arrow">›</span>`;
    item.addEventListener('click',()=>showFiche(i));
    tl.appendChild(item);
  });
}

function buildSection(sec, col){
  if(sec.type==='defs')
    return `<div class="fsec"><div class="fsec-title" style="color:${col}">${sec.title}</div>${sec.items.map(it=>`<div class="def-block" style="border-left-color:${col}"><span class="kw" style="color:${col}">${it.term}</span><br><span style="color:var(--txt2)">${it.def}</span></div>`).join('')}</div>`;
  if(sec.type==='table')
    return `<div class="fsec"><div class="fsec-title" style="color:${col}">${sec.title}</div><div style="overflow-x:auto"><table class="ftable"><thead><tr>${sec.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${sec.rows.map(row=>`<tr>${row.map((cell,ci)=>`<td class="${ci===0?'key':''}" ${ci===0?`style="color:${col}"`:''}>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  if(sec.type==='modele')
    return `<div class="fsec"><div class="fsec-title" style="color:${col}">${sec.title}</div><div class="modele"><div class="modele-title">// MODÈLE : ${sec.label}</div><div class="modele-body">${sec.content}</div></div></div>`;
  if(sec.type==='example')
    return `<div class="fsec"><div class="fsec-title" style="color:${col}">${sec.title}</div><div class="example-block"><div class="ex-label">// EXEMPLE CONCRET</div><div class="ex-content">${sec.content.replace(/\n/g,'<br>')}</div></div></div>`;
  if(sec.type==='retenir')
    return `<div class="fsec"><div class="fsec-title" style="color:${col}">${sec.title}</div><div class="retenir" style="background:${col}06;border:1px solid ${col}25"><div class="r-label" style="color:${col}">// POINTS CLÉS</div><ul>${sec.items.map(it=>`<li><span style="color:${col};position:absolute;left:0">›</span>${it}</li>`).join('')}</ul></div></div>`;
  return '';
}

function showFiche(idx){
  const th = THEMES[idx];
  const col = th.color;
  document.querySelectorAll('.tl-item').forEach((el,i)=>el.classList.toggle('active',i===idx));
  const container = document.getElementById('fiche-container');
  container.innerHTML=`
    <div class="fiche show" style="--fiche-col:${col}">
      <div class="fiche-header">
        <div class="fiche-eyebrow">${th.id} · FICHE DÉTAILLÉE · Rédaction Administrative</div>
        <div class="fiche-title">${th.icon} ${th.name}</div>
        <div class="fiche-subtitle">${th.nature}</div>
      </div>
      <div class="fiche-body">${th.sections.map(s=>buildSection(s,col)).join('')}</div>
      <div class="fiche-nav">
        <button class="fiche-nav-btn" onclick="showFiche(${idx-1})" ${idx===0?'disabled':''}>&#8592; Précédent</button>
        <span style="font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--txt3)">${idx+1} / ${THEMES.length}</span>
        <button class="fiche-nav-btn" onclick="showFiche(${idx+1})" ${idx===THEMES.length-1?'disabled':''}>Suivant &#8594;</button>
      </div>
    </div>`;
  container.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function switchView(view, btn){
  document.querySelectorAll('.vt-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-condensed').style.display = view==='condensed'?'block':'none';
  document.getElementById('view-detail').style.display = view==='detail'?'block':'none';
}

buildCondensed();
buildThemeList();
</script>
</body>
</html>
